name: daily-recommendations

on:
  workflow_dispatch:
  schedule:
    - cron: "25 21 * * *" # 毎朝 6:25 JST に開始（巡回に最大20分強）し、7時ごろまでに更新を終える

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -t .
      # 過去の実行で見つかった会場コードを引き継ぐ
      - uses: actions/cache@v4
        with:
          path: data/places.json
          key: places-${{ github.run_id }}
          restore-keys: places-
      - run: python -m tennisbear fetch --out data/events.json
      - run: python -m tennisbear build --events data/events.json --out site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
