name: daily-recommendations

on:
  workflow_dispatch:
  # テニスベアの取得処理（tennisbear/fetch.py）を実装したら有効にする。毎朝 7:13 JST
  # schedule:
  #   - cron: "13 22 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .
      - run: python -m tennisbear fetch --out data/events.json
      - run: python -m tennisbear build --events data/events.json --out site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
