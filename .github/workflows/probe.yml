name: probe-tennisbear

# 一時的な調査用: テニスベアの公開ページ構造をログに出す
on:
  push:
    branches: ["probe/**"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          cat > nuxt.js <<'JS'
          // HTML 中の window.__NUXT__ を隔離した vm で評価して JSON で出力する
          const fs = require("fs"), vm = require("vm");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const m = html.match(/<script>(window\.__NUXT__=[\s\S]*?)<\/script>/);
          const ctx = { window: {} };
          vm.runInNewContext(m[1], ctx, { timeout: 2000 });
          process.stdout.write(JSON.stringify(ctx.window.__NUXT__));
          JS
          UA="Mozilla/5.0 (compatible; personal-event-digest)"
          B=https://www.tennisbear.net
          get() { curl -sS -A "$UA" "$1" -o "$2"; sleep 10; }
          get $B/event/prefecture/pref14 list.html
          get "$B/event/prefecture/pref14?date=2026-10-31" list_date.html
          get "$B/event/prefecture/pref14?page=2" list_page2.html
          get $B/event/1687562/info detail.html
          for f in list list_date list_page2 detail; do node nuxt.js $f.html > $f.json; done
          python3 - <<'PY'
          import json
          def find(o, key, path=""):
              if isinstance(o, dict):
                  for k, v in o.items():
                      if k == key: yield path + "." + k, v
                      yield from find(v, key, path + "." + k)
              elif isinstance(o, list):
                  for i, v in enumerate(o[:1]): yield from find(v, key, f"{path}[{i}]")
          for f in ["list", "list_date", "list_page2"]:
              d = json.load(open(f + ".json"))
              for p, v in find(d, "eventList"):
                  if v:
                      print("#####", f, p, len(v), [e.get("startDatetime") or e.get("startDateTime") for e in (v[0], v[-1])])
                      if f == "list": print(json.dumps(v[0], ensure_ascii=False, indent=1)[:5000])
              for k in ["eventListCountAll", "isFinished", "page", "searchParam", "searchCondition"]:
                  for p, v in find(d, k):
                      if "event" in p.lower() and "beach" not in p.lower() and "pickle" not in p.lower(): print(f, p, json.dumps(v, ensure_ascii=False)[:800])
          d = json.load(open("detail.json"))
          ev = d["state"]["feature"]["event"]["eventDetail"]["EventDetail"]
          ev["event"].pop("eventContents", None)
          print("##### detail EventDetail:"); print(json.dumps(ev, ensure_ascii=False, indent=1)[:15000])
          PY
