name: probe-tennisbear

# 一時的な調査用: テニスベアの公開ページ構造をログに出す
on:
  push:
    branches: ["probe/**"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pages
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148"
          mkdir out
          for u in https://www.tennisbear.net/robots.txt https://www.tennisbear.net/ https://www.tennisbear.net/event https://www.tennisbear.net/events https://www.tennisbear.net/terms; do
            f=out/$(echo "$u" | sed 's#[^a-zA-Z0-9]#_#g')
            code=$(curl -sSL -A "$UA" -o "$f" -w "%{http_code} %{url_effective}" "$u" || true)
            echo "=== $u -> $code ($(wc -c < "$f" 2>/dev/null) bytes)"
          done
      - name: Dump
        run: |
          cd out
          echo "##### robots"; cat *robots_txt | head -50
          for f in *; do
            echo "##### $f"
            echo "--- title/meta"; grep -oiE '<title>[^<]*</title>|<meta name="description"[^>]*>' "$f" | head -5
            echo "--- framework hints"; grep -oE '__NEXT_DATA__|__NUXT__|data-reactroot|ng-version|wp-content|application/ld\+json' "$f" | sort | uniq -c
            echo "--- links"; grep -oE 'href="[^"#]+"' "$f" | sort -u | head -120
          done
          echo "##### body text of top page"
          python3 - <<'PY'
          import re, glob
          for f in sorted(glob.glob("*")):
              if "robots" in f: continue
              s = open(f, encoding="utf-8", errors="replace").read()
              s = re.sub(r"(?s)<(script|style)[^>]*>.*?</\1>", "", s)
              t = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", s))
              print("=====", f); print(t[:3000])
          PY
