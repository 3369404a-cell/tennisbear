name: probe-tennisbear

# 一時的な調査用: テニスベアの公開ページ構造をログに出す
on:
  push:
    branches: ["probe/**"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          cat > nuxt.js <<'JS'
          // HTML 中の window.__NUXT__ を隔離した vm で評価して JSON で出力する
          const fs = require("fs"), vm = require("vm");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const m = html.match(/<script>(window\.__NUXT__=[\s\S]*?)<\/script>/);
          const ctx = { window: {} };
          vm.runInNewContext(m[1], ctx, { timeout: 2000 });
          process.stdout.write(JSON.stringify(ctx.window.__NUXT__));
          JS
          UA="Mozilla/5.0 (compatible; personal-event-digest)"
          B=https://www.tennisbear.net
          get() { curl -sS -A "$UA" "$1" -o "$2"; sleep 10; }
          get $B/event/prefecture/pref14 list.html
          get "$B/event/prefecture/pref14?date=2026-10-31" list_date.html
          get "$B/event/prefecture/pref14?page=2" list_page2.html
          get $B/event/1687562/info detail.html
          for f in list list_date list_page2 detail; do node nuxt.js $f.html > $f.json; done
          python3 - <<'PY'
          import json, re
          def walk(o, path=""):
              if isinstance(o, dict):
                  for k, v in o.items(): yield from walk(v, f"{path}.{k}")
              elif isinstance(o, list) and o:
                  yield path, o
                  yield from walk(o[0], path + "[0]")
          for f in ["list", "list_date", "list_page2"]:
              d = json.load(open(f + ".json"))
              print("#####", f, "fetch keys:", list(d["fetch"].keys()))
              lists = [(p, v) for p, v in walk(d) if isinstance(v[0], dict) and ("startDatetime" in v[0] or "eventId" in v[0] or "title" in v[0]) and "advertising" not in p]
              for p, v in lists:
                  print(p, len(v), "first start:", v[0].get("startDatetime"), "last:", v[-1].get("startDatetime"))
              if f == "list" and lists:
                  print("--- sample list item:"); print(json.dumps(lists[0][1][0], ensure_ascii=False, indent=1)[:4000])
          d = json.load(open("detail.json"))
          st = {k: v for k, v in d["state"].items() if k != "global"}
          print("##### detail state (non-global):"); print(json.dumps(st, ensure_ascii=False, indent=1)[:12000])
          print("##### detail data/fetch:"); print(json.dumps({"data": d["data"], "fetch": d["fetch"]}, ensure_ascii=False)[:6000])
          PY
