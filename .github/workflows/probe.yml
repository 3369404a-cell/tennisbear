name: probe-tennisbear

# 一時的な調査用: テニスベアの公開ページ構造をログに出す
on:
  push:
    branches: ["probe/**"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          pip install -q pypdf
          python3 - <<'PY'
          import json, re, urllib.request, io
          UA = "Mozilla/5.0 (compatible; personal-event-digest)"
          def get(u):
              req = urllib.request.Request(u, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()
          B = "https://www.tennisbear.net"
          print("##### robots.txt"); print(get(B + "/robots.txt").decode()[:2000])

          from pypdf import PdfReader
          t = "".join(p.extract_text() or "" for p in PdfReader(io.BytesIO(get(B + "/pdf/terms-of-service_5.pdf"))).pages)
          print("##### terms: clauses mentioning scraping/automation")
          for m in re.finditer(r"[^。\n]*(スクレイピング|クローラ|自動的|自動化|ロボット|プログラム|複製|転載|収集)[^。\n]*。?", t):
              print("-", m.group(0).strip())

          def show(u):
              s = get(u).decode("utf-8", "replace")
              print(f"##### {u} ({len(s)} chars)")
              for i, m in enumerate(re.finditer(r'<script type="application/ld\+json"[^>]*>(.*?)</script>', s, re.S)):
                  print(f"--- ld+json {i}:", m.group(1)[:2500])
              print("--- pagination/query links:", sorted(set(re.findall(r'href="([^"]*(?:page|\?)[^"]*)"', s)))[:30])
              n = s.find("window.__NUXT__")
              print("--- __NUXT__ head:", s[n:n+1500] if n >= 0 else None)
              print("--- __NUXT__ tail:", s[s.find("</script>", n)-2500:s.find("</script>", n)] if n >= 0 else None)
              body = re.sub(r"(?s)<(script|style)[^>]*>.*?</\1>", "", s)
              text = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", body))
              print("--- text:", text[:2500])
              return s
          s = show(B + "/event/prefecture/pref14")
          ids = re.findall(r'/event/(\d+)/info', s)
          print("event ids on page:", len(ids), ids[:5])
          show(B + f"/event/{ids[0]}/info")

          # Nuxt のJSからAPIのURLらしきものを探す
          js = sorted(set(re.findall(r'src="(/_nuxt/[^"]+\.js)"', s)))
          found = set()
          for j in js:
              src = get(B + j).decode("utf-8", "replace")
              found |= set(re.findall(r'https?://[a-zA-Z0-9.-]*tennisbear[a-zA-Z0-9.-]*(?:/[a-zA-Z0-9_/.-]*)?', src))
              found |= set(m for m in re.findall(r'["\'`](/(?:api|v\d)/[a-zA-Z0-9_/.${}-]*event[a-zA-Z0-9_/.${}-]*)', src))
          print("##### api-like urls in js"); [print(f) for f in sorted(found)[:80]]
          PY
