# おすすめイベントの条件。ここを書き換えると翌日の一覧に反映されます。

[level]
# 参加したいベアレベル。イベントの対象レベル範囲と1つでも重なれば候補になる。
levels = [5, 6]

[area]
# 対象の都道府県（いずれかに一致すれば候補）
prefectures = ["東京都", "神奈川県", "埼玉県"]
# 市区町村で絞りたい場合に指定（空なら絞らない）例: ["世田谷区", "川崎市"]
cities = []

[style]
# タイトル・説明に含まれると加点されるキーワード
prefer_keywords = ["練習多め", "ラリー", "練習", "球出し", "ドリル", "基礎", "ストローク", "ボレー"]
# 含まれると減点されるキーワード（練習メインを優先するため）
avoid_keywords = ["大会", "試合のみ", "ゲームのみ", "団体戦", "リーグ戦"]
# 含まれると候補から除外するキーワード
exclude_keywords = []

[people]
# 主催者・参加者の年代（10の位）。一致すると加点。
preferred_age_decades = [20, 30]

[schedule]
# 何日先までのイベントを対象にするか
days_ahead = 14
# 参加しやすい曜日（空なら全曜日）。月=0 … 日=6
weekdays = []
# 開始時刻の範囲（"HH:MM"）。空文字なら絞らない
start_after = ""
start_before = ""

[budget]
# 参加費の上限（円）。0 なら上限なし
max_fee = 0

[near_match]
# 完全一致でなくても「近い候補」として載せる範囲
# 希望レベルから何段階までずれたイベントを候補にするか（0 なら重なるものだけ）
level_tolerance = 1
# 満たしていない希望条件（レベル・練習系・年代）がいくつまでなら載せるか（0 なら完全一致のみ）
max_misses = 2

[output]
# 一覧に載せる件数（完全一致 → 近い候補の順）
top_n = 40

[fetch]
# 詳細ページを開く上限（10秒間隔なので 80件で約13分）
max_details = 80
