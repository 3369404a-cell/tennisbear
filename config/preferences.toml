# おすすめイベントの条件。ここを書き換えると翌日の一覧に反映されます。

[level]
# 参加したいベアレベル。イベントの対象レベル範囲と1つでも重なれば一致。
levels = [5, 6]

[area]
# 対象の都道府県（いずれかに一致すれば候補）
prefectures = ["東京都", "神奈川県", "埼玉県"]
# 市区町村で絞りたい場合に指定（空なら絞らない）例: ["世田谷区", "川崎市"]
cities = []

[style]
# イベント名にどれかが入っていれば「ラリー・練習系」として必ず載せる
title_keywords = ["ラリー", "練習", "球出し", "ドリル", "基礎", "ストローク", "ボレー"]
# タグ・本文に含まれると加点されるキーワード（イベント名に入っていない場合のおすすめ判定にも使う）
prefer_keywords = ["練習多め", "ラリー", "練習", "球出し", "ドリル", "基礎", "ストローク", "ボレー"]
# 含まれると減点されるキーワード（練習メインを優先するため）
avoid_keywords = ["大会", "試合のみ", "ゲームのみ", "団体戦", "リーグ戦"]
# 含まれると候補から除外するキーワード
exclude_keywords = []

[people]
# 主催者・参加者の年代（10の位）。一致すると加点。
preferred_age_decades = [20, 30]

[schedule]
# 対象期間: weeks_from 週後の月曜から weeks 週間（1, 2 なら来週と再来週）
weeks_from = 1
weeks = 2
# true なら土日祝のイベントだけ
weekend_holiday_only = true
# 開始時刻の範囲（"HH:MM"）。空文字なら絞らない
start_after = ""
start_before = ""

[budget]
# 参加費の上限（円）。0 なら上限なし
max_fee = 0

[near_match]
# 希望レベルから何段階までずれたイベントを候補にするか（0 なら重なるものだけ）
level_tolerance = 1
# 満たしていない希望条件（レベル・練習系・年代）がいくつまでなら載せるか
max_misses = 2

[recommend]
# イベント名にキーワードがなくても「その他のおすすめ」に載せる最低点
other_min_score = 25

[output]
# 各セクションに載せる上限件数
top_n = 40

[fetch]
# 詳細ページを開く上限（10秒間隔なので 80件で約13分）
max_details = 80
# 巡回する会場ページの上限（都道府県一覧で見つかった会場も自動で追加される）
max_places = 50
# 必ず巡回する会場コード（テニスベアの /place/{コード}/events）
places = [
  "0100030001", # 平和の森公園庭球場（大田区）
  "0100010009", # 亀戸中央公園（江東区）
  "0100090005", # 大蔵第二運動場（世田谷区）
  "0100010007", # 芝公園（港区）
  "0100020002", # 青山運動場（港区）
  "0100010016", # 赤塚公園（板橋区）
  "0100780001", # 馬込テニスクラブ（大田区）
  "0100060007", # 清水ケ丘公園（横浜市）
  "0102390001", # KPI LINK（大和市）
]
